<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO101 Remote Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        
        h1 {
            font-size: 1.4em;
            font-weight: 500;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }
        
        .status-dot.connected {
            background: #44ff44;
        }
        
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .rerun-panel {
            flex: 1;
            min-width: 0;
        }
        
        .rerun-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .controls-panel {
            width: 320px;
            background: #16213e;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-left: 1px solid #0f3460;
            overflow-y: auto;
        }
        
        .control-section {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 12px;
        }
        
        .control-section h3 {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Virtual Joystick */
        .joystick-container {
            display: flex;
            justify-content: space-around;
            gap: 16px;
        }
        
        .joystick-wrapper {
            text-align: center;
        }
        
        .joystick-label {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 6px;
        }
        
        .joystick {
            width: 120px;
            height: 120px;
            background: #0f3460;
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #e94560, #c73e54);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .joystick-knob:active {
            cursor: grabbing;
        }
        
        /* Triggers */
        .triggers-container {
            display: flex;
            justify-content: space-around;
            gap: 16px;
        }
        
        .trigger-wrapper {
            text-align: center;
            flex: 1;
        }
        
        .trigger-label {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 6px;
        }
        
        .trigger {
            width: 100%;
            height: 60px;
            background: #0f3460;
            border-radius: 8px;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }
        
        .trigger-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #e94560, #c73e54);
            transition: height 0.05s;
        }
        
        .trigger-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: bold;
            z-index: 1;
        }
        
        /* Buttons */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .btn {
            padding: 12px 8px;
            background: #0f3460;
            border: none;
            border-radius: 6px;
            color: #eee;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .btn:hover {
            background: #1a4a7a;
        }
        
        .btn:active, .btn.active {
            background: #e94560;
            transform: scale(0.95);
        }
        
        /* Gamepad Status */
        .gamepad-info {
            font-size: 0.8em;
            color: #888;
            text-align: center;
        }
        
        .gamepad-info.active {
            color: #44ff44;
        }
        
        /* Debug values */
        .debug-values {
            font-family: monospace;
            font-size: 0.7em;
            color: #666;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        
        /* Mobile responsive */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            
            .controls-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #0f3460;
            }
            
            .rerun-panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🤖 SO101 Remote Control</h1>
        <div class="status">
            <span id="statusText">Disconnected</span>
            <div class="status-dot" id="statusDot"></div>
        </div>
    </header>
    
    <div class="main-container">
        <div class="rerun-panel">
            <iframe id="rerunFrame" src="about:blank"></iframe>
        </div>
        
        <div class="controls-panel">
            <div class="control-section">
                <h3>Physical Gamepad</h3>
                <p class="gamepad-info" id="gamepadInfo">Press any button to connect gamepad</p>
            </div>
            
            <div class="control-section">
                <h3>Virtual Joysticks</h3>
                <div class="joystick-container">
                    <div class="joystick-wrapper">
                        <div class="joystick-label">Position (XY)</div>
                        <div class="joystick" id="leftJoystick">
                            <div class="joystick-knob" id="leftKnob"></div>
                        </div>
                    </div>
                    <div class="joystick-wrapper">
                        <div class="joystick-label">Orientation</div>
                        <div class="joystick" id="rightJoystick">
                            <div class="joystick-knob" id="rightKnob"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="control-section">
                <h3>Triggers (Height / Gripper)</h3>
                <div class="triggers-container">
                    <div class="trigger-wrapper">
                        <div class="trigger-label">Down (LT)</div>
                        <div class="trigger" id="leftTrigger">
                            <div class="trigger-fill" id="leftTriggerFill"></div>
                            <span class="trigger-value" id="leftTriggerValue">0%</span>
                        </div>
                    </div>
                    <div class="trigger-wrapper">
                        <div class="trigger-label">Up (RT)</div>
                        <div class="trigger" id="rightTrigger">
                            <div class="trigger-fill" id="rightTriggerFill"></div>
                            <span class="trigger-value" id="rightTriggerValue">0%</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="control-section">
                <h3>Buttons</h3>
                <div class="buttons-grid">
                    <button class="btn" id="btnA" data-btn="button_a">A<br><small>Clutch</small></button>
                    <button class="btn" id="btnB" data-btn="button_b">B</button>
                    <button class="btn" id="btnX" data-btn="button_x">X</button>
                    <button class="btn" id="btnY" data-btn="button_y">Y</button>
                    <button class="btn" id="btnLB" data-btn="button_lb">LB<br><small>Open</small></button>
                    <button class="btn" id="btnRB" data-btn="button_rb">RB<br><small>Close</small></button>
                    <button class="btn" id="btnUp" data-btn="dpad_up">↑</button>
                    <button class="btn" id="btnDown" data-btn="dpad_down">↓</button>
                </div>
            </div>
            
            <div class="control-section">
                <h3>Debug</h3>
                <div class="debug-values" id="debugValues">
                    <span>LX: 0.00</span>
                    <span>LY: 0.00</span>
                    <span>RX: 0.00</span>
                    <span>RY: 0.00</span>
                    <span>LT: 0.00</span>
                    <span>RT: 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration (injected by server)
        const WS_URL = "{{WS_URL}}";
        
        // State
        let ws = null;
        let connected = false;
        let physicalGamepad = null;
        let gamepadIndex = -1;
        
        const state = {
            left_x: 0,
            left_y: 0,
            right_x: 0,
            right_y: 0,
            left_trigger: 0,
            right_trigger: 0,
            button_a: false,
            button_b: false,
            button_x: false,
            button_y: false,
            button_lb: false,
            button_rb: false,
            dpad_up: false,
            dpad_down: false,
            dpad_left: false,
            dpad_right: false,
        };
        
        // Virtual joystick state
        const virtualState = {
            left_x: 0,
            left_y: 0,
            right_x: 0,
            right_y: 0,
            left_trigger: 0,
            right_trigger: 0,
        };
        
        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const gamepadInfo = document.getElementById('gamepadInfo');
        const rerunFrame = document.getElementById('rerunFrame');
        const debugValues = document.getElementById('debugValues');
        
        // Connect to WebSocket
        function connect() {
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => {
                connected = true;
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                console.log('WebSocket connected');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'config') {
                    // Use the local Rerun web viewer served by Python
                    // It's already connected to the gRPC server
                    rerunFrame.src = data.rerun_web_url;
                    console.log('ReRun web viewer URL:', data.rerun_web_url);
                }
            };
            
            ws.onclose = () => {
                connected = false;
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                console.log('WebSocket disconnected, reconnecting...');
                setTimeout(connect, 2000);
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }
        
        // Send state to server
        function sendState() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'gamepad',
                    state: state
                }));
            }
        }
        
        // Virtual Joystick handling
        function setupJoystick(joystickEl, knobEl, onMove, xKey, yKey) {
            let active = false;
            const rect = () => joystickEl.getBoundingClientRect();
            const radius = 60; // Half of joystick size
            const knobRadius = 25; // Half of knob size
            const maxDist = radius - knobRadius;
            
            function updatePosition(clientX, clientY) {
                const r = rect();
                const centerX = r.left + r.width / 2;
                const centerY = r.top + r.height / 2;
                
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                
                // Clamp to circle
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                
                // Update knob position
                knobEl.style.left = `calc(50% + ${dx}px)`;
                knobEl.style.top = `calc(50% + ${dy}px)`;
                
                // Normalize to -1 to 1
                const normX = dx / maxDist;
                const normY = dy / maxDist;
                
                virtualState[xKey] = normX;
                virtualState[yKey] = normY;
                onMove(normX, normY);
            }
            
            function reset() {
                knobEl.style.left = '50%';
                knobEl.style.top = '50%';
                virtualState[xKey] = 0;
                virtualState[yKey] = 0;
                onMove(0, 0);
            }
            
            // Mouse events
            joystickEl.addEventListener('mousedown', (e) => {
                active = true;
                updatePosition(e.clientX, e.clientY);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (active) updatePosition(e.clientX, e.clientY);
            });
            
            document.addEventListener('mouseup', () => {
                if (active) {
                    active = false;
                    reset();
                }
            });
            
            // Touch events
            joystickEl.addEventListener('touchstart', (e) => {
                active = true;
                const touch = e.touches[0];
                updatePosition(touch.clientX, touch.clientY);
                e.preventDefault();
            });
            
            document.addEventListener('touchmove', (e) => {
                if (active) {
                    const touch = e.touches[0];
                    updatePosition(touch.clientX, touch.clientY);
                }
            });
            
            document.addEventListener('touchend', () => {
                if (active) {
                    active = false;
                    reset();
                }
            });
        }
        
        // Virtual trigger handling
        function setupTrigger(triggerEl, fillEl, valueEl, stateKey) {
            let active = false;
            
            function updateValue(clientY) {
                const rect = triggerEl.getBoundingClientRect();
                const relY = rect.bottom - clientY;
                const value = Math.max(0, Math.min(1, relY / rect.height));
                
                fillEl.style.height = `${value * 100}%`;
                valueEl.textContent = `${Math.round(value * 100)}%`;
                virtualState[stateKey] = value;
                
                // Update main state if no physical gamepad
                if (gamepadIndex < 0) {
                    state[stateKey] = value;
                }
            }
            
            function reset() {
                fillEl.style.height = '0%';
                valueEl.textContent = '0%';
                virtualState[stateKey] = 0;
                if (gamepadIndex < 0) {
                    state[stateKey] = 0;
                }
            }
            
            triggerEl.addEventListener('mousedown', (e) => {
                active = true;
                updateValue(e.clientY);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (active) updateValue(e.clientY);
            });
            
            document.addEventListener('mouseup', () => {
                if (active) {
                    active = false;
                    reset();
                }
            });
            
            triggerEl.addEventListener('touchstart', (e) => {
                active = true;
                updateValue(e.touches[0].clientY);
                e.preventDefault();
            });
            
            document.addEventListener('touchmove', (e) => {
                if (active) updateValue(e.touches[0].clientY);
            });
            
            document.addEventListener('touchend', () => {
                if (active) {
                    active = false;
                    reset();
                }
            });
        }
        
        // Virtual button handling
        function setupButtons() {
            document.querySelectorAll('.btn[data-btn]').forEach(btn => {
                const key = btn.dataset.btn;
                
                const activate = () => {
                    btn.classList.add('active');
                    state[key] = true;
                };
                
                const deactivate = () => {
                    btn.classList.remove('active');
                    state[key] = false;
                };
                
                btn.addEventListener('mousedown', activate);
                btn.addEventListener('mouseup', deactivate);
                btn.addEventListener('mouseleave', deactivate);
                btn.addEventListener('touchstart', (e) => { activate(); e.preventDefault(); });
                btn.addEventListener('touchend', deactivate);
            });
        }
        
        // Physical gamepad handling
        window.addEventListener('gamepadconnected', (e) => {
            gamepadIndex = e.gamepad.index;
            physicalGamepad = e.gamepad;
            gamepadInfo.textContent = `✓ ${e.gamepad.id}`;
            gamepadInfo.classList.add('active');
            console.log('Gamepad connected:', e.gamepad.id);
        });
        
        window.addEventListener('gamepaddisconnected', (e) => {
            if (e.gamepad.index === gamepadIndex) {
                gamepadIndex = -1;
                physicalGamepad = null;
                gamepadInfo.textContent = 'Gamepad disconnected';
                gamepadInfo.classList.remove('active');
            }
        });
        
        function pollGamepad() {
            if (gamepadIndex >= 0) {
                const gp = navigator.getGamepads()[gamepadIndex];
                if (gp) {
                    // Axes (Xbox-style mapping)
                    state.left_x = applyDeadzone(gp.axes[0] || 0);
                    state.left_y = applyDeadzone(gp.axes[1] || 0);
                    state.right_x = applyDeadzone(gp.axes[2] || 0);
                    state.right_y = applyDeadzone(gp.axes[3] || 0);
                    
                    // Triggers
                    state.left_trigger = Math.max(0, gp.buttons[6]?.value || 0);
                    state.right_trigger = Math.max(0, gp.buttons[7]?.value || 0);
                    
                    // Buttons
                    state.button_a = gp.buttons[0]?.pressed || false;
                    state.button_b = gp.buttons[1]?.pressed || false;
                    state.button_x = gp.buttons[2]?.pressed || false;
                    state.button_y = gp.buttons[3]?.pressed || false;
                    state.button_lb = gp.buttons[4]?.pressed || false;
                    state.button_rb = gp.buttons[5]?.pressed || false;
                    
                    // D-pad
                    state.dpad_up = gp.buttons[12]?.pressed || false;
                    state.dpad_down = gp.buttons[13]?.pressed || false;
                    state.dpad_left = gp.buttons[14]?.pressed || false;
                    state.dpad_right = gp.buttons[15]?.pressed || false;
                }
            } else {
                // Use virtual joystick values when no physical gamepad
                state.left_x = virtualState.left_x;
                state.left_y = virtualState.left_y;
                state.right_x = virtualState.right_x;
                state.right_y = virtualState.right_y;
                state.left_trigger = virtualState.left_trigger;
                state.right_trigger = virtualState.right_trigger;
            }
            
            // Update debug display
            debugValues.innerHTML = `
                <span>LX: ${state.left_x.toFixed(2)}</span>
                <span>LY: ${state.left_y.toFixed(2)}</span>
                <span>RX: ${state.right_x.toFixed(2)}</span>
                <span>RY: ${state.right_y.toFixed(2)}</span>
                <span>LT: ${state.left_trigger.toFixed(2)}</span>
                <span>RT: ${state.right_trigger.toFixed(2)}</span>
            `;
            
            // Update virtual trigger display to match physical
            if (gamepadIndex >= 0) {
                document.getElementById('leftTriggerFill').style.height = `${state.left_trigger * 100}%`;
                document.getElementById('leftTriggerValue').textContent = `${Math.round(state.left_trigger * 100)}%`;
                document.getElementById('rightTriggerFill').style.height = `${state.right_trigger * 100}%`;
                document.getElementById('rightTriggerValue').textContent = `${Math.round(state.right_trigger * 100)}%`;
            }
            
            sendState();
        }
        
        function applyDeadzone(value, deadzone = 0.1) {
            if (Math.abs(value) < deadzone) return 0;
            return value;
        }
        
        // Initialize
        function init() {
            connect();
            
            // Setup virtual joysticks
            setupJoystick(
                document.getElementById('leftJoystick'),
                document.getElementById('leftKnob'),
                (x, y) => {
                    if (gamepadIndex < 0) {
                        state.left_x = x;
                        state.left_y = y;
                    }
                },
                'left_x', 'left_y'
            );
            
            setupJoystick(
                document.getElementById('rightJoystick'),
                document.getElementById('rightKnob'),
                (x, y) => {
                    if (gamepadIndex < 0) {
                        state.right_x = x;
                        state.right_y = y;
                    }
                },
                'right_x', 'right_y'
            );
            
            // Setup triggers
            setupTrigger(
                document.getElementById('leftTrigger'),
                document.getElementById('leftTriggerFill'),
                document.getElementById('leftTriggerValue'),
                'left_trigger'
            );
            
            setupTrigger(
                document.getElementById('rightTrigger'),
                document.getElementById('rightTriggerFill'),
                document.getElementById('rightTriggerValue'),
                'right_trigger'
            );
            
            // Setup buttons
            setupButtons();
            
            // Main loop - poll gamepad and send state at 60Hz
            setInterval(pollGamepad, 16);
        }
        
        init();
    </script>
</body>
</html>
