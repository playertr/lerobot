<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SO101 Remote Control</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        
        /* Fullscreen camera feed */
        #cameraFeed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .no-camera-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #666;
            font-size: 1.2em;
            z-index: 0;
        }
        
        /* Robot 3D overlay - top left */
        #robotOverlay {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 180px;
            height: 180px;
            z-index: 10;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        #robotCanvas {
            width: 100%;
            height: 100%;
        }
        
        /* Status indicator - top right */
        .status-indicator {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }
        
        .status-dot.connected {
            background: #44ff44;
        }
        
        /* Virtual controls overlay - bottom */
        #virtualControls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15;
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            transition: opacity 0.3s, transform 0.3s;
        }
        
        #virtualControls.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }
        
        /* Joysticks row */
        .joysticks-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        
        .joystick-zone {
            width: 140px;
            height: 140px;
            position: relative;
        }
        
        .joystick-label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        /* Center controls (bumpers + triggers) */
        .center-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
            padding: 0 10px;
        }
        
        .bumpers-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 200px;
        }
        
        .bumper-btn {
            flex: 1;
            padding: 12px 6px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.75em;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s;
        }
        
        .bumper-btn:active, .bumper-btn.active {
            background: #e94560;
            border-color: #e94560;
            transform: scale(0.95);
        }
        
        .triggers-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 200px;
        }
        
        .trigger-btn {
            flex: 1;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        
        .trigger-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #e94560, #c73e54);
            transition: height 0.05s;
        }
        
        .trigger-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.8);
            z-index: 1;
            pointer-events: none;
        }
        
        /* Action buttons (X for clutch) */
        .action-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 200px;
        }
        
        .action-btn {
            flex: 1;
            padding: 14px 8px;
            background: rgba(100, 100, 255, 0.2);
            border: 1px solid rgba(100, 100, 255, 0.4);
            border-radius: 8px;
            color: #fff;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.1s;
        }
        
        .action-btn:active, .action-btn.active {
            background: rgba(100, 100, 255, 0.6);
            transform: scale(0.95);
        }
        
        /* Gamepad connected message */
        .gamepad-notice {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0, 100, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 25px;
            font-size: 0.9em;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .gamepad-notice.visible {
            opacity: 1;
        }
        
        /* Debug panel (collapsible) */
        .debug-toggle {
            position: fixed;
            top: 15px;
            left: 200px;
            z-index: 25;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            border-radius: 15px;
            color: #888;
            font-size: 0.7em;
            cursor: pointer;
        }
        
        .debug-panel {
            position: fixed;
            top: 50px;
            left: 200px;
            z-index: 24;
            padding: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.65em;
            color: #aaa;
            display: none;
        }
        
        .debug-panel.visible {
            display: block;
        }
        
        .debug-row {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <!-- Camera feed (fullscreen background) -->
    <div class="no-camera-overlay" id="noCameraOverlay">
        <span>Waiting for camera...</span>
    </div>
    <img id="cameraFeed" src="" alt="" style="display: none;">
    
    <!-- Robot 3D overlay -->
    <div id="robotOverlay">
        <canvas id="robotCanvas"></canvas>
    </div>
    
    <!-- Status indicator -->
    <div class="status-indicator">
        <span id="statusText">Disconnected</span>
        <div class="status-dot" id="statusDot"></div>
    </div>
    
    <!-- Debug toggle -->
    <button class="debug-toggle" id="debugToggle">Debug</button>
    <div class="debug-panel" id="debugPanel">
        <div class="debug-row">
            <span id="dbgLX">LX: 0.00</span>
            <span id="dbgLY">LY: 0.00</span>
            <span id="dbgRX">RX: 0.00</span>
            <span id="dbgRY">RY: 0.00</span>
        </div>
        <div class="debug-row">
            <span id="dbgLT">LT: 0.00</span>
            <span id="dbgRT">RT: 0.00</span>
            <span id="dbgClutch">Clutch: OFF</span>
        </div>
        <div class="debug-row">
            <span id="dbgEE">EE: [-.---, -.---, -.---]</span>
        </div>
    </div>
    
    <!-- Virtual controls (hidden when gamepad connected) -->
    <div id="virtualControls">
        <div class="joysticks-row">
            <!-- Left joystick -->
            <div class="joystick-zone" id="leftJoystickZone">
                <span class="joystick-label">Position (XY)</span>
            </div>
            
            <!-- Center: Bumpers + Triggers + Clutch -->
            <div class="center-controls">
                <div class="bumpers-row">
                    <button class="bumper-btn" id="btnLB" data-btn="button_lb">LB</button>
                    <button class="bumper-btn" id="btnRB" data-btn="button_rb">RB</button>
                </div>
                <div class="triggers-row">
                    <div class="trigger-btn" id="leftTrigger">
                        <div class="trigger-fill" id="leftTriggerFill"></div>
                        <span class="trigger-label">LT Open</span>
                    </div>
                    <div class="trigger-btn" id="rightTrigger">
                        <div class="trigger-fill" id="rightTriggerFill"></div>
                        <span class="trigger-label">RT Close</span>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="btnX" data-btn="button_x">X Clutch</button>
                </div>
            </div>
            
            <!-- Right joystick -->
            <div class="joystick-zone" id="rightJoystickZone">
                <span class="joystick-label">Orientation</span>
            </div>
        </div>
    </div>
    
    <!-- Gamepad connected notice -->
    <div class="gamepad-notice" id="gamepadNotice">
        🎮 Gamepad Connected
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFLoader.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import URDFLoader from 'urdf-loader';
        
        window.STLLoader = STLLoader;
        
        // Configuration (injected by server)
        const CONFIGURED_WS_URL = "{{WS_URL}}";
        const URDF_PATH = "{{URDF_PATH}}";
        
        // Compute WebSocket URL using page's host
        function getWebSocketURL() {
            const configuredHost = new URL(CONFIGURED_WS_URL).hostname;
            const pageHost = window.location.hostname;
            
            if (configuredHost === pageHost || pageHost === 'localhost' || pageHost === '127.0.0.1') {
                return CONFIGURED_WS_URL;
            }
            
            const wsPort = new URL(CONFIGURED_WS_URL).port;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const newUrl = `${protocol}//${pageHost}:${wsPort}`;
            console.log(`[WS] Using page host: ${newUrl}`);
            return newUrl;
        }
        
        const WS_URL = getWebSocketURL();
        
        // State
        let ws = null;
        let connected = false;
        let physicalGamepad = null;
        let gamepadIndex = -1;
        let robot = null;
        let eeTargetMarker = null;
        
        const state = {
            left_x: 0, left_y: 0,
            right_x: 0, right_y: 0,
            left_trigger: 0, right_trigger: 0,
            button_a: false, button_b: false,
            button_x: false, button_y: false,
            button_lb: false, button_rb: false,
            dpad_up: false, dpad_down: false,
            dpad_left: false, dpad_right: false,
        };
        
        const virtualState = {
            left_x: 0, left_y: 0,
            right_x: 0, right_y: 0,
            left_trigger: 0, right_trigger: 0,
        };
        
        // DOM elements
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const cameraFeed = document.getElementById('cameraFeed');
        const noCameraOverlay = document.getElementById('noCameraOverlay');
        const virtualControls = document.getElementById('virtualControls');
        const gamepadNotice = document.getElementById('gamepadNotice');
        const debugPanel = document.getElementById('debugPanel');
        const debugToggle = document.getElementById('debugToggle');
        
        // Debug toggle
        debugToggle.addEventListener('click', () => {
            debugPanel.classList.toggle('visible');
        });
        
        // Three.js setup for robot overlay
        let scene, camera3d, renderer, controls;
        
        function initThreeJS() {
            const canvas = document.getElementById('robotCanvas');
            const container = document.getElementById('robotOverlay');
            
            scene = new THREE.Scene();
            // Transparent background
            scene.background = null;
            
            camera3d = new THREE.PerspectiveCamera(50, 1, 0.01, 10);
            camera3d.up.set(0, 0, 1);
            camera3d.position.set(0.4, -0.35, 0.35);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                alpha: true  // Transparent background
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);
            
            controls = new OrbitControls(camera3d, renderer.domElement);
            controls.target.set(0.15, 0, 0.15);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.enableZoom = false;  // Disable zoom on mobile
            controls.update();
            
            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            
            const directional = new THREE.DirectionalLight(0xffffff, 0.6);
            directional.position.set(1, 2, 1);
            scene.add(directional);
            
            // No grid - transparent background
            
            // Small axes at origin
            const axes = new THREE.AxesHelper(0.08);
            scene.add(axes);
            
            // EE marker
            createEEMarker();
            
            // Load URDF
            loadURDF();
            
            animate();
        }
        
        function loadURDF() {
            const loader = new URDFLoader();
            const stlLoader = new STLLoader();
            
            loader.loadMeshCb = (path, manager, onComplete) => {
                stlLoader.load(path, (geometry) => {
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xffd700,
                        shininess: 30,
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    onComplete(mesh);
                }, undefined, (err) => {
                    console.error('Mesh load error:', path, err);
                    onComplete(null, err);
                });
            };
            
            loader.load(URDF_PATH, (loadedRobot) => {
                robot = loadedRobot;
                scene.add(robot);
                console.log('URDF loaded');
            }, undefined, (err) => {
                console.error('URDF load error:', err);
            });
        }
        
        function updateRobotJoints(positions) {
            if (!robot) return;
            for (const [joint, degrees] of Object.entries(positions)) {
                if (robot.joints[joint]) {
                    robot.joints[joint].setJointValue(degrees * Math.PI / 180);
                }
            }
        }
        
        function createEEMarker() {
            eeTargetMarker = new THREE.Group();
            
            const sphereGeom = new THREE.SphereGeometry(0.012, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ff00,
                transparent: true,
                opacity: 0.9
            });
            const sphere = new THREE.Mesh(sphereGeom, sphereMat);
            sphere.name = 'eeMarkerSphere';
            eeTargetMarker.add(sphere);
            
            const axes = new THREE.AxesHelper(0.04);
            eeTargetMarker.add(axes);
            
            eeTargetMarker.visible = false;
            scene.add(eeTargetMarker);
        }
        
        function updateEEVisualization(pos, rot, clutch) {
            if (!eeTargetMarker || !pos || !rot) return;
            
            eeTargetMarker.position.set(pos[0], pos[1], pos[2]);
            
            const rotMat = new THREE.Matrix4();
            rotMat.set(
                rot[0][0], rot[0][1], rot[0][2], 0,
                rot[1][0], rot[1][1], rot[1][2], 0,
                rot[2][0], rot[2][1], rot[2][2], 0,
                0, 0, 0, 1
            );
            eeTargetMarker.quaternion.setFromRotationMatrix(rotMat);
            
            const sphere = eeTargetMarker.getObjectByName('eeMarkerSphere');
            if (sphere) {
                sphere.material.color.setHex(clutch ? 0xff0000 : 0x00ff00);
            }
            
            eeTargetMarker.visible = true;
            
            // Update debug
            document.getElementById('dbgEE').textContent = 
                `EE: [${pos[0].toFixed(3)}, ${pos[1].toFixed(3)}, ${pos[2].toFixed(3)}]`;
            document.getElementById('dbgClutch').textContent = 
                `Clutch: ${clutch ? 'ON' : 'OFF'}`;
            document.getElementById('dbgClutch').style.color = clutch ? '#ff6666' : '#66ff66';
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera3d);
        }
        
        // WebSocket connection
        let reconnectAttempts = 0;
        
        function connect() {
            if (ws) {
                ws.onclose = null;
                ws.onerror = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                }
            }
            
            statusText.textContent = 'Connecting...';
            
            try {
                ws = new WebSocket(WS_URL);
                ws.binaryType = 'arraybuffer';
            } catch (e) {
                console.error('WebSocket error:', e);
                scheduleReconnect();
                return;
            }
            
            ws.onopen = () => {
                connected = true;
                reconnectAttempts = 0;
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            };
            
            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const blob = new Blob([event.data], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    cameraFeed.onload = () => URL.revokeObjectURL(url);
                    cameraFeed.src = url;
                    cameraFeed.style.display = 'block';
                    noCameraOverlay.style.display = 'none';
                } else {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'joints') {
                            updateRobotJoints(data.positions);
                        } else if (data.type === 'ee_state') {
                            updateEEVisualization(data.target_pos, data.target_rot, data.clutch);
                        }
                    } catch (e) {}
                }
            };
            
            ws.onclose = () => {
                connected = false;
                statusDot.classList.remove('connected');
                scheduleReconnect();
            };
            
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }
        
        function scheduleReconnect() {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
            reconnectAttempts++;
            statusText.textContent = `Reconnecting...`;
            setTimeout(connect, delay);
        }
        
        function sendState() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'gamepad', state: state }));
            }
        }
        
        // Nipple.js joysticks
        let leftJoystick, rightJoystick;
        
        function setupNippleJoysticks() {
            const options = {
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'rgba(255, 255, 255, 0.3)',
                size: 120,
                restOpacity: 0.5,
            };
            
            leftJoystick = nipplejs.create({
                zone: document.getElementById('leftJoystickZone'),
                ...options,
            });
            
            leftJoystick.on('move', (evt, data) => {
                const force = Math.min(data.force, 1);
                const angle = data.angle.radian;
                virtualState.left_x = Math.cos(angle) * force;
                virtualState.left_y = -Math.sin(angle) * force;  // Invert Y
            });
            
            leftJoystick.on('end', () => {
                virtualState.left_x = 0;
                virtualState.left_y = 0;
            });
            
            rightJoystick = nipplejs.create({
                zone: document.getElementById('rightJoystickZone'),
                ...options,
            });
            
            rightJoystick.on('move', (evt, data) => {
                const force = Math.min(data.force, 1);
                const angle = data.angle.radian;
                virtualState.right_x = Math.cos(angle) * force;
                virtualState.right_y = -Math.sin(angle) * force;
            });
            
            rightJoystick.on('end', () => {
                virtualState.right_x = 0;
                virtualState.right_y = 0;
            });
        }
        
        // Virtual triggers
        function setupTriggers() {
            function setupTrigger(el, fillEl, stateKey) {
                let active = false;
                
                function updateValue(clientY) {
                    const rect = el.getBoundingClientRect();
                    const relY = rect.bottom - clientY;
                    const value = Math.max(0, Math.min(1, relY / rect.height));
                    fillEl.style.height = `${value * 100}%`;
                    virtualState[stateKey] = value;
                }
                
                function reset() {
                    fillEl.style.height = '0%';
                    virtualState[stateKey] = 0;
                }
                
                el.addEventListener('touchstart', (e) => {
                    active = true;
                    updateValue(e.touches[0].clientY);
                    e.preventDefault();
                });
                
                document.addEventListener('touchmove', (e) => {
                    if (active) updateValue(e.touches[0].clientY);
                });
                
                document.addEventListener('touchend', () => {
                    if (active) { active = false; reset(); }
                });
                
                el.addEventListener('mousedown', (e) => {
                    active = true;
                    updateValue(e.clientY);
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (active) updateValue(e.clientY);
                });
                
                document.addEventListener('mouseup', () => {
                    if (active) { active = false; reset(); }
                });
            }
            
            setupTrigger(
                document.getElementById('leftTrigger'),
                document.getElementById('leftTriggerFill'),
                'left_trigger'
            );
            
            setupTrigger(
                document.getElementById('rightTrigger'),
                document.getElementById('rightTriggerFill'),
                'right_trigger'
            );
        }
        
        // Virtual buttons
        function setupButtons() {
            document.querySelectorAll('[data-btn]').forEach(btn => {
                const key = btn.dataset.btn;
                
                const activate = () => { btn.classList.add('active'); state[key] = true; };
                const deactivate = () => { btn.classList.remove('active'); state[key] = false; };
                
                btn.addEventListener('mousedown', activate);
                btn.addEventListener('mouseup', deactivate);
                btn.addEventListener('mouseleave', deactivate);
                btn.addEventListener('touchstart', (e) => { activate(); e.preventDefault(); });
                btn.addEventListener('touchend', deactivate);
            });
        }
        
        // Gamepad handling
        function updateGamepadVisibility() {
            const hasGamepad = gamepadIndex >= 0;
            virtualControls.classList.toggle('hidden', hasGamepad);
            gamepadNotice.classList.toggle('visible', hasGamepad);
        }
        
        window.addEventListener('gamepadconnected', (e) => {
            gamepadIndex = e.gamepad.index;
            physicalGamepad = e.gamepad;
            console.log('Gamepad connected:', e.gamepad.id);
            updateGamepadVisibility();
        });
        
        window.addEventListener('gamepaddisconnected', (e) => {
            if (e.gamepad.index === gamepadIndex) {
                gamepadIndex = -1;
                physicalGamepad = null;
                updateGamepadVisibility();
            }
        });
        
        function applyDeadzone(value, deadzone = 0.1) {
            return Math.abs(value) < deadzone ? 0 : value;
        }
        
        function pollGamepad() {
            if (gamepadIndex >= 0) {
                const gp = navigator.getGamepads()[gamepadIndex];
                if (gp) {
                    state.left_x = applyDeadzone(gp.axes[0] || 0);
                    state.left_y = applyDeadzone(gp.axes[1] || 0);
                    state.right_x = applyDeadzone(gp.axes[2] || 0);
                    state.right_y = applyDeadzone(gp.axes[3] || 0);
                    state.left_trigger = Math.max(0, gp.buttons[6]?.value || 0);
                    state.right_trigger = Math.max(0, gp.buttons[7]?.value || 0);
                    state.button_a = gp.buttons[0]?.pressed || false;
                    state.button_b = gp.buttons[1]?.pressed || false;
                    state.button_x = gp.buttons[2]?.pressed || false;
                    state.button_y = gp.buttons[3]?.pressed || false;
                    state.button_lb = gp.buttons[4]?.pressed || false;
                    state.button_rb = gp.buttons[5]?.pressed || false;
                    state.dpad_up = gp.buttons[12]?.pressed || false;
                    state.dpad_down = gp.buttons[13]?.pressed || false;
                    state.dpad_left = gp.buttons[14]?.pressed || false;
                    state.dpad_right = gp.buttons[15]?.pressed || false;
                }
            } else {
                state.left_x = virtualState.left_x;
                state.left_y = virtualState.left_y;
                state.right_x = virtualState.right_x;
                state.right_y = virtualState.right_y;
                state.left_trigger = virtualState.left_trigger;
                state.right_trigger = virtualState.right_trigger;
            }
            
            // Update debug display
            document.getElementById('dbgLX').textContent = `LX: ${state.left_x.toFixed(2)}`;
            document.getElementById('dbgLY').textContent = `LY: ${state.left_y.toFixed(2)}`;
            document.getElementById('dbgRX').textContent = `RX: ${state.right_x.toFixed(2)}`;
            document.getElementById('dbgRY').textContent = `RY: ${state.right_y.toFixed(2)}`;
            document.getElementById('dbgLT').textContent = `LT: ${state.left_trigger.toFixed(2)}`;
            document.getElementById('dbgRT').textContent = `RT: ${state.right_trigger.toFixed(2)}`;
            
            // Mirror physical gamepad to virtual display
            if (gamepadIndex >= 0) {
                document.getElementById('leftTriggerFill').style.height = `${state.left_trigger * 100}%`;
                document.getElementById('rightTriggerFill').style.height = `${state.right_trigger * 100}%`;
            }
            
            sendState();
        }
        
        // Initialize
        function init() {
            connect();
            initThreeJS();
            setupNippleJoysticks();
            setupTriggers();
            setupButtons();
            setInterval(pollGamepad, 16);  // 60Hz
        }
        
        init();
    </script>
</body>
</html>
